<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace</title>
    <link rel="icon" href="data:," />
    <meta name="description" content="A workspace you can explore. The projects are in the room." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f1216" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&display=swap"
    />
    <!--
      Critical styles only. The stylesheet is imported from the module graph, so without this
      the loading screen paints unstyled for a moment before it arrives.
    -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1216; color: #e9ecef; }
      body { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      .loader { position: fixed; inset: 0; z-index: 40; display: grid; place-content: center; gap: 18px; background: #0f1216; }
      .loader-track { width: 260px; height: 2px; background: rgba(233, 236, 239, 0.14); overflow: hidden; }
      .loader-fill { height: 100%; background: #e9ecef; transform: scaleX(0); transform-origin: left center; }
      .loader-label { margin: 0; text-align: center; font-size: 12px; letter-spacing: 0.08em; text-transform: lowercase; color: rgba(233, 236, 239, 0.42); }
      #panel, #music { display: none; }
    </style>
  </head>
  <body>
    <h1 class="sr-only">Workspace</h1>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="veil" aria-hidden="true"></div>

    <!-- Real preparation stages, not a timed animation: the bar moves when work completes. -->
    <div id="loader" class="loader" role="status" aria-live="polite">
      <div class="loader-track"><div class="loader-fill" id="loader-fill"></div></div>
      <p class="loader-label" id="loader-label">Preparing the room</p>
    </div>

    <p id="hint" class="hint" aria-live="polite"></p>
    <p id="hover-label" class="hover-label" aria-hidden="true"></p>
    <p id="live" class="sr-only" aria-live="polite"></p>
    <div
      id="shelf-mode"
      class="sr-only"
      tabindex="-1"
      role="group"
      aria-label="Bookshelf. Left and right arrows browse the books, Enter opens the selected one, Escape leaves the shelf."
    ></div>
    <p id="shelf-caption" class="shelf-caption" aria-hidden="true"><b></b><span></span></p>

    <nav class="sr-only" aria-label="Objects in the room" id="object-nav"></nav>

    <aside id="panel" class="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" hidden>
      <p class="panel-kind" id="panel-kind"></p>
      <h2 class="panel-title" id="panel-title" tabindex="-1"></h2>
      <p class="panel-summary" id="panel-summary"></p>
      <dl class="panel-sections" id="panel-sections"></dl>
      <div class="panel-footer">
        <button class="panel-close" id="panel-close" type="button">
          Back to room <kbd>Esc</kbd>
        </button>
      </div>
    </aside>

    <!-- Small enough to belong to the workspace rather than sit on top of it. -->
    <aside id="music" class="music" hidden>
      <button class="music-toggle" id="music-toggle" type="button" aria-pressed="false">
        <span class="music-glyph" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sr-only">Play</span>
      </button>
      <span class="music-meta">
        <span class="music-title" id="music-title">Fortress of Lies</span>
        <span class="music-artist" id="music-artist">Keiichi Okabe &middot; NieR:Automata</span>
      </span>
      <span class="music-progress" aria-hidden="true"><i id="music-elapsed"></i></span>
      <span class="music-note" id="music-note" hidden></span>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
